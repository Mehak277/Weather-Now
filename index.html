<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cool Weather App</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #89f7fe, #66a6ff);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      color: #fff;
      overflow: hidden;
      transition: background 1s ease;
    }

    .container {
      text-align: center;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
      backdrop-filter: blur(8px);
      width: 350px;
      transition: 0.3s ease;
    }

    .title {
      font-size: 2em;
      margin-bottom: 20px;
    }

    .search-box {
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    input {
      padding: 10px;
      border-radius: 10px;
      border: none;
      width: 180px;
      font-size: 1em;
      outline: none;
    }

    button {
      background: #0078ff;
      border: none;
      color: white;
      border-radius: 10px;
      padding: 10px 15px;
      cursor: pointer;
      font-weight: 600;
      transition: 0.3s;
    }

    button:hover {
      background: #005ecf;
    }

    .weather-box {
      margin-top: 30px;
      animation: fadeIn 0.8s ease-in-out;
    }

    .weather-box img {
      width: 100px;
      margin-bottom: 10px;
    }

    .hidden {
      display: none;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="title">🌈 Weather Now</h1>

    <div class="search-box">
      <input type="text" id="cityInput" placeholder="Enter city name..." />
      <button id="searchBtn">Get Weather</button>
    </div>

    <div id="weatherBox" class="weather-box hidden">
      <img id="weatherIcon" src="" alt="Weather Icon" />
      <h2 id="location"></h2>
      <h3 id="temperature"></h3>
      <p id="condition"></p>
      <p id="humidity"></p>
      <p id="wind"></p>
    </div>
  </div>

  <script>
    const apiKey = "9d277a3322794a22b0885810251210";
    const searchBtn = document.getElementById("searchBtn");
    const cityInput = document.getElementById("cityInput");

    searchBtn.addEventListener("click", getWeather);
    cityInput.addEventListener("keypress", (e) => {
      if (e.key === "Enter") getWeather();
    });

    async function getWeather() {
      const city = cityInput.value.trim();
      if (!city) {
        alert("Please enter a city name!");
        return;
      }

      const url = `http://api.weatherapi.com/v1/current.json?key=${apiKey}&q=${city}&aqi=yes`;

      try {
        const response = await fetch(url);
        const data = await response.json();

        if (data.error) {
          alert("City not found!");
          return;
        }

        document.getElementById("weatherBox").classList.remove("hidden");
        document.getElementById("location").textContent = `${data.location.name}, ${data.location.country}`;
        document.getElementById("temperature").textContent = `${data.current.temp_c}°C`;
        document.getElementById("condition").textContent = data.current.condition.text;
        document.getElementById("humidity").textContent = `💧 Humidity: ${data.current.humidity}%`;
        document.getElementById("wind").textContent = `🌬️ Wind: ${data.current.wind_kph} km/h`;
        document.getElementById("weatherIcon").src = `https:${data.current.condition.icon}`;

        // Dynamic background based on weather
        const bg = document.body;
        if (data.current.is_day === 0) {
          bg.style.background = "linear-gradient(135deg, #2b5876, #4e4376)";
        } else if (data.current.condition.text.toLowerCase().includes("rain")) {
          bg.style.background = "linear-gradient(135deg, #667db6, #0082c8, #0082c8, #667db6)";
        } else if (data.current.condition.text.toLowerCase().includes("cloud")) {
          bg.style.background = "linear-gradient(135deg, #bdc3c7, #2c3e50)";
        } else {
          bg.style.background = "linear-gradient(135deg, #89f7fe, #66a6ff)";
        }

      } catch (error) {
        console.error("Error fetching weather data:", error);
        alert("Something went wrong. Try again!");
      }
    }
  </script>
</body>
</html>
